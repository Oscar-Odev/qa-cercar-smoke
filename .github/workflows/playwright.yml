name: Playwright smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run smoke tests
        env:
          CERCAR_BASE_URL: https://cercar.odev.es
          CERCAR_GUEST_SHARE_PATH: ${{ secrets.CERCAR_GUEST_SHARE_PATH }}
          CERCAR_QA_EMAIL: ${{ secrets.CERCAR_QA_EMAIL }}
          CERCAR_QA_PASSWORD: ${{ secrets.CERCAR_QA_PASSWORD }}
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
